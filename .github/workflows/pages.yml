name: Publicació web

# Publica l'aplicació a GitHub Pages. El que es publica és exactament el fitxer
# que hi ha a dist/: aquesta feina no el reconstrueix, el comprova. Si no
# correspon a src/ i data/, s'atura i no publica res, de manera que l'adreça
# pública i el fitxer que es baixa del dipòsit no poden divergir mai.
#
# Vegeu tools/pagines.py i docs/adr/0006-versio-web-i-pwa.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Els desplegaments no es cancel·len entre ells: val més publicar-ne un de més
# que deixar la pàgina a mig camí.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publica:
    name: Munta i desplega
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.desplegament.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Comprova que dist/ correspon a les fonts
        run: python -m tools.build --verifica

      - name: Munta el lloc a _site/
        run: python -m tools.pagines

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Desplega
        id: desplegament
        uses: actions/deploy-pages@v4
