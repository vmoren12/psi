name: Errada al currículum o al banc de mesures
description: El text d'una mesura, d'un criteri d'avaluació o d'un saber no és correcte.
title: "[contingut] "
labels: ["contingut"]
body:
  - type: markdown
    attributes:
      value: |
        Gràcies. Aquest és el tipus d'aportació més útil que pot rebre el
        projecte: el que hi ha en aquestes dades acaba dins d'un document que
        signa un centre.

        **No hi enganxeu dades d'alumnat real.**

  - type: dropdown
    id: on
    attributes:
      label: On és l'errada
      options:
        - Banc de mesures i suports
        - Currículum de l'ESO (annex 3)
        - Currículum de primària (annex 2)
        - Equivalències entre matèries i àrees
        - Plantilles de mesures per perfil
    validations:
      required: true

  - type: input
    id: identificador
    attributes:
      label: Identificador o localització
      description: >
        L'identificador de la mesura (per exemple `U-DUA-01`), o la matèria i
        el codi del criteri (per exemple «Matemàtiques, CE3, criteri 3.2»).
      placeholder: "U-DUA-01"
    validations:
      required: true

  - type: textarea
    id: diu
    attributes:
      label: Què hi diu ara
      description: Copieu el text tal com surt a l'aplicació.
    validations:
      required: true

  - type: textarea
    id: hauria
    attributes:
      label: Què hi hauria de dir
    validations:
      required: true

  - type: textarea
    id: font
    attributes:
      label: Font
      description: >
        De quin document oficial surt la versió correcta i, si podeu, en quina
        pàgina o article. Sense això costa molt més validar el canvi.
      placeholder: "Decret 175/2022, annex 3, p. 214"
    validations:
      required: true
